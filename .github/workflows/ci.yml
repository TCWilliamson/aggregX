name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          # Prebuilt binaries are built with an older Go than go.mod targets;
          # build the linter with the toolchain set up above.
          install-mode: goinstall
      - name: generated code is up to date
        run: make schemas && git diff --exit-code
      - name: test (race, coverage)
        run: go test -race -coverprofile=cover.out ./...
      - name: coverage gate (data-path packages >= 90%)
        run: scripts/coverage-gate.sh cover.out 90 iotp/internal/wire iotp/internal/ingest

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install zcbor 'cbor2<5.7'
      - name: golden vectors vs CDDL
        run: scripts/validate-vectors.sh
      - name: C codec vs golden vectors
        run: scripts/c-vectors.sh
      - name: install ARM toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-arm-none-eabi
      - name: device code fits the smallest chip (nRF52840)
        run: scripts/c-size-budget.sh

  stack:
    runs-on: ubuntu-latest
    needs: [go, contracts]
    steps:
      - uses: actions/checkout@v4
      - name: start dev stack
        run: docker compose -f deploy/compose/compose.yaml up -d --build --wait --wait-timeout 300 haproxy core workers
      - name: smoke
        run: docker compose -f deploy/compose/compose.yaml --profile tools run --rm simulator
      - name: logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --tail=200
