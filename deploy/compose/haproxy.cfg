# Dev HAProxy (design doc "Ingress", spec 02 §4, spec 03 §6.1).
global
    log stdout format raw local0
    maxconn 4000            # dev; production sizing in Phase 1
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# Device and gateway ingress. Client certificates are optional at the TLS layer
# and required on the gateway path.
frontend devices
    bind :8443 ssl crt /certs/haproxy-ingest.pem ca-file /certs/gateway-ca.pem verify optional
    # Per-IP limit on new connections only, generous (spec 03 §6.1).
    stick-table type ip size 100k expire 60s store conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_rate(0) gt 500 }
    # Never trust an identity header from outside.
    http-request del-header X-Client-Identity
    acl gw_path path_beg /v1/gw/
    acl cert_ok ssl_c_used ssl_c_verify 0
    http-request deny deny_status 401 if gw_path !cert_ok
    http-request set-header X-Client-Identity %[ssl_c_s_dn(CN)] if gw_path cert_ok
    default_backend ingest

# Portal and API (plain HTTP in dev).
frontend api
    bind :8080
    default_backend core

backend ingest
    option httpchk GET /readyz
    server ingest1 ingest:8080 check

backend core
    option httpchk GET /healthz
    server core1 core:8080 check

frontend stats
    bind :8404
    stats enable
    stats uri /
